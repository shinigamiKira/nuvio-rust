[package]
name = "nuvio"
description = "Nuvio for Windows and macOS, written in Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
# The paste button reads the clipboard itself; egui only hands text over for Ctrl+V.
arboard = { version = "3.7.0", default-features = false }
anyhow = "1.0.104"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "system_fonts", "clipboard"] }
# Colour glyphs, so the emoji addons put in stream descriptions (folders, discs, flags) draw as the system font has them.
epaint = { version = "0.37.0", default-features = false, features = ["color_fonts"] }
fast_image_resize = "6.1.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
# Torrent streaming. Not librqbit's default-tls: that selects rustls with aws-lc, which needs a C++ build chain; the HTTP side
# already uses the system TLS through reqwest (native-tls), and SHA-1 comes from the Windows crypto API.
librqbit = { version = "9.0.1", default-features = false, features = ["http-api", "tracing-subscriber-utils"] }
librqbit-dualstack-sockets = { version = "0.7.0", default-features = false, features = ["axum"] }
librqbit-core = { version = "9.0.1", default-features = false, features = ["sha1-crypto-hash"] }
librqbit-sha1-wrapper = { version = "9.0.1", default-features = false, features = ["sha1-crypto-hash"] }
nuvio-core = { version = "0.1.0", path = "../core" }
nuvio-mpv = { version = "0.1.0", path = "../mpv" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_System_Console", "Win32_Media", "Win32_System_Power"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.191"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSScreen"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSGeometry", "NSObjCRuntime", "NSProcessInfo", "NSString"] }

[build-dependencies]
embed-resource = "3.0.12"
