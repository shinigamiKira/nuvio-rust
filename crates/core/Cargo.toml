[package]
name = "nuvio-core"
description = "Stremio addon protocol, catalogs, streams and local storage for Nuvio"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
percent-encoding = "2.3.2"
regex-lite = "0.1.9"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "gzip", "brotli", "deflate", "http2", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net"] }
tracing = "0.1.44"

[dev-dependencies]
tiny_http = "0.12.0"
